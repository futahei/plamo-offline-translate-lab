name: Deploy PLaMo browser PoC to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  # 先行デプロイを強制終了するとPages側に実行中ロックが残る場合がある。
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      # Build and cache PLaMo 3 tokenizer-compatible WASM, rather than using
      # the published wllama 3.8.1 runtime which cannot decode this model.
      - uses: actions/cache@v4
        id: wllama-cache
        with:
          path: public/vendor/wllama
          key: plamo3-wllama-d275dac-emsdk-4.0.20-v1
      - name: Compile PLaMo 3-compatible wllama (cold cache only)
        if: steps.wllama-cache.outputs.cache-hit != 'true'
        run: bash scripts/build-wllama.sh
      # オフライン実験用のQ4_0はGGUFの正規分割形式で生成する。
      # GitHub Pagesに配布し、wllamaのOPFSキャッシュに保存する。
      - uses: actions/cache@v4
        id: q4-shards-cache
        with:
          path: public/models
          key: plamo3-q4-0-gguf-split-32t-d6be065-v2
      - name: Split Q4_0 GGUF for iPhone experiment (cold cache only)
        if: steps.q4-shards-cache.outputs.cache-hit != 'true'
        run: bash scripts/build-q4-shards.sh
      # Restoreした旧キャッシュにも最新のサイズ情報を付けて配布する。
      - name: Refresh shard manifest from cached GGUF files
        run: node scripts/write-q4-manifest.mjs public/models
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  # ビルドと公開を分離し、デプロイ失敗時の「失敗ジョブだけ再実行」で
  # 同じrunに github-pages 成果物が重複作成される問題を防ぐ。
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
